version: 2
updates:
  - package-ecosystem: cargo
    directory: "/aptos-gas-analyzer"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      major:
        applies-to: version-updates
        update-types:
          - "major"
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
